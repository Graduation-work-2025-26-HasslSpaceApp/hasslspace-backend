spring:
  application:
    name: server-service
  datasource:
    url: jdbc:postgresql://${DEV_ENV_HOST}:5432/${DEV_ENV_DB_NAME}
    username: ${DEV_ENV_DB_USER}
    password: ${DEV_ENV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
#  liquibase:
#    enabled: true
#logging:
#  level:
#    org.springframework.jdbc.core: DEBUG

invite_base_url: ${DEV_ENV_INVITE_URL}

app:
  s3:
    bucket: ${DEV_ENV_S3_BUCKET}
    endpoint: ${DEV_ENV_S3_ENDPOINT}
    region: ${DEV_ENV_S3_REGION}
    access-key: ${DEV_ENV_S3_ACCESS_KEY}
    secret-key: ${DEV_ENV_S3_SECRET_KEY}

server:
  port: ${DEV_ENV_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  prometheus:
    metrics:
      export:
        enabled: true