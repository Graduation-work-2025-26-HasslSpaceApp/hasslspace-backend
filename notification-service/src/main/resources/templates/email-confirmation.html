<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HasslSpace — Подтверждение почты</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, sans-serif; background-color:#0f1a1c;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f1a1c; padding:40px 0;">
    <tr>
        <td align="center">

            <!-- Card -->
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px; background-color:#f4f6f7; border-radius:20px; overflow:hidden;">

                <!-- Header / Gradient -->
                <tr>
                    <td
                            style="
              background: linear-gradient(160deg, #0d3b40 0%, #114e55 40%, #e9eff0 100%);
              padding:32px 28px;
              text-align:left;
            ">

                        <h1 style="
                margin:0;
                font-size:24px;
                color:#ffffff;
                font-weight:700;
                letter-spacing:0.3px;
            ">
                            HasslSpace
                        </h1>

                        <p style="
                margin:10px 0 0;
                font-size:14px;
                color:#d7e4e7;
            ">
                            Подтверждение электронной почты
                        </p>

                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:36px 28px; text-align:center;">

                        <p style="
                margin:0 0 18px;
                font-size:16px;
                color:#1c2b2e;
            ">
                            Введите этот код, чтобы завершить регистрацию:
                        </p>

                        <!-- Code Box -->
                        <div style="
                display:inline-block;
                background:#ffffff;
                padding:18px 26px;
                border-radius:14px;
                font-size:30px;
                font-weight:700;
                letter-spacing:8px;
                color:#0d3b40;
                box-shadow:0 4px 14px rgba(0,0,0,0.08);
                user-select:all;
            ">
                            <span th:text="${code}">123456</span>
                        </div>

<!--                        <p style="-->
<!--                margin-top:26px;-->
<!--                font-size:13px;-->
<!--                color:#6b7c80;-->
<!--            ">-->
<!--                            Код действителен в течение 10 минут.-->
<!--                        </p>-->

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="
              background-color:#e9eff0;
              padding:18px;
              text-align:center;
              font-size:12px;
              color:#6b7c80;
          ">
                        Если вы не запрашивали этот код — просто проигнорируйте письмо.
                    </td>
                </tr>

            </table>
            <!-- End Card -->

        </td>
    </tr>
</table>

</body>
</html>
