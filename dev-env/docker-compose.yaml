services:
  postgres:
    image: postgres
    container_name: hassl_space_db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=hassl_space_db

  nginx:
    build: .
    ports:
      - "8080:8080"
    environment:
      # oh no, hardcoded secret in docker-compose.yaml, but it's just for development environment
      - JWT_SECRET=JZ4UO4EZxsyIb3bSn6lvnQGrHk077a3woOSIvtyUuCQ=
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro

  centrifugo:
    image: centrifugo/centrifugo:latest
    container_name: centrifugo
    ports:
      - "8000:8000"
    volumes:
      - ./config.json:/centrifugo/config.json
    command: centrifugo -c config.json
