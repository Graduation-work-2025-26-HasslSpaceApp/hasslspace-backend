worker_processes 1;

events {
    worker_connections 1024;
}

env JWT_SECRET;

http {
    lua_shared_dict jwt_cache 10m;

    server {
        listen 8080;

        # --- USER SERVICE (без JWT) ---
        location /api/user-service/ {
            proxy_pass http://host.docker.internal:8081;
        }

        # --- SERVER SERVICE ---
        location /api/server-service/ {
            access_by_lua_block {
                local jwt = require "resty.jwt"
                local ngx_decode_base64 = ngx.decode_base64

                -- берём секрет из переменной окружения и декодируем Base64
                local secret_base64 = os.getenv("JWT_SECRET")
                if not secret_base64 then
                    ngx.log(ngx.ERR, "JWT_SECRET not set")
                    ngx.exit(500)
                end
                local secret = ngx_decode_base64(secret_base64)
                if not secret then
                    ngx.log(ngx.ERR, "Failed to decode JWT_SECRET from Base64")
                    ngx.exit(500)
                end

                -- читаем Authorization header
                local auth_header = ngx.var.http_Authorization
                if not auth_header then
                    ngx.exit(401)
                end

                local token = string.match(auth_header, "Bearer%s+(.+)")
                if not token then
                    ngx.exit(401)
                end

                -- проверяем JWT с декодированным секретом
                local jwt_obj = jwt:verify(secret, token)
                if not jwt_obj.verified then
                    ngx.log(ngx.ERR, "JWT verification failed")
                    ngx.exit(401)
                end

                -- достаём userId из payload и добавляем в header
                local user_id = jwt_obj.payload.userId
                if not user_id then
                    ngx.exit(403)
                end
                ngx.req.set_header("X-User-Id", user_id)
            }

            proxy_pass http://host.docker.internal:8082;
        }

        # --- CHAT SERVICE ---
        location /api/chat-service/ {
            access_by_lua_block {
                local jwt = require "resty.jwt"

                local secret = os.getenv("JWT_SECRET")

                local auth_header = ngx.var.http_Authorization
                if not auth_header then
                    ngx.exit(401)
                end

                local token = string.match(auth_header, "Bearer%s+(.+)")
                if not token then
                    ngx.exit(401)
                end

                local jwt_obj = jwt:verify(secret, token)

                if not jwt_obj.verified then
                    ngx.exit(401)
                end

                local user_id = jwt_obj.payload.userId
                ngx.req.set_header("X-User-Id", user_id)
            }

            proxy_pass http://host.docker.internal:8083;
        }

        # --- VOICE SERVICE ---
        location /api/voice-service/ {
            access_by_lua_block {
                local jwt = require "resty.jwt"

                local secret = os.getenv("JWT_SECRET")

                local auth_header = ngx.var.http_Authorization
                if not auth_header then
                    ngx.exit(401)
                end

                local token = string.match(auth_header, "Bearer%s+(.+)")
                if not token then
                    ngx.exit(401)
                end

                local jwt_obj = jwt:verify(secret, token)

                if not jwt_obj.verified then
                    ngx.exit(401)
                end

                local user_id = jwt_obj.payload.userId
                ngx.req.set_header("X-User-Id", user_id)
            }

            proxy_pass http://host.docker.internal:8084;
        }
    }
}