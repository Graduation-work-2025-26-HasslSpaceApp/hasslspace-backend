name: user-service

replicaCount: 1

image:
  repository: whomustnotbenamed/hasslspace
  tag: user-service-1.2.0-arm64
  pullPolicy: IfNotPresent

service:
  port: 8081

env:
  DB_HOST: host.minikube.internal
  DB_PORT: "5432"
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""

  JWT_SECRET: ""
  JWT_EXPIRATION: ""

  S3_BUCKET: s3-hasslspace
  S3_ENDPOINT: https://storage.yandexcloud.net
  S3_REGION: ru-central1
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

  NOTIFICATION_HOST: notification-service
  NOTIFICATION_PORT: "8085"
  NOTIFICATION_TRANSPORT_TYPE: "KAFKA"

  KAFKA_HOST: host.minikube.internal
  KAFKA_PORT: "9092"
